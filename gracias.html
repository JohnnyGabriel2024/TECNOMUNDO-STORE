
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje enviado | TecnoMundo Store</title>

  <meta http-equiv="refresh" content="3;url=index.html">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    body {
      background: #0b1630;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    .confirmation {
      max-width: 650px;
      width: 90%;
      background: #111f3d;
      border: 1px solid #263b5e;
      border-radius: 24px;
      padding: 50px 30px;
      text-align: center;
    }

    .icon {
      color: #22d3ee;
      font-size: 5rem;
    }

    .btn-cyan {
      background: #22d3ee;
      color: #0b1630;
      font-weight: bold;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
    }

    .btn-cyan:hover {
      background: white;
      color: #0b1630;
    }
  </style>
</head>

<body>

  <div class="confirmation">
    <i class="bi bi-check-circle-fill icon"></i>

    <h1 class="fw-bold mt-4">¡Mensaje enviado!</h1>

    <p class="text-light mt-3">
      Gracias por contactar a TecnoMundo Store.
      Hemos recibido tu mensaje y responderemos a la brevedad.
    </p>

    <p class="text-secondary">
      Serás redirigido automáticamente a nuestra página principal en 3 segundos.
    </p>

    <a href="index.html" class="btn btn-cyan mt-3">
      <i class="bi bi-house-fill me-2"></i>
      Volver al inicio
    </a>
  </div>

</body>
</html>
